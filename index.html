<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>520 ❤️</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: "Segoe UI", sans-serif;
    background: radial-gradient(circle at center, #2a003f, #000);
}

/* 背景渐变光 */
.bg-glow {
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, rgba(255,77,109,0.2), transparent 70%);
}

/* 居中 */
.center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: white;
}

/* ❤️ SVG */
svg {
    width: 320px;
    height: 320px;
}

/* 心形路径（更细） */
path {
    fill: none;
    stroke: #ff4d6d;
    stroke-width: 2;
    stroke-dasharray: 1500;
    stroke-dashoffset: 1500;
    animation: draw 3s ease forwards;
    filter: drop-shadow(0 0 15px #ff4d6d);
}

/* 粒子光点 */
.spark {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #ff4d6d;
    border-radius: 50%;
    box-shadow: 0 0 10px #ff4d6d;
    animation: sparkle 1s linear infinite;
}

@keyframes sparkle {
    from { opacity: 1; }
    to { opacity: 0; transform: scale(2); }
}

/* 字体（更大更高级） */
h1 {
    font-size: 72px;
    margin: 20px 0 10px;
    opacity: 0;
    animation: fadeIn 2s ease forwards;
    animation-delay: 3s;
    letter-spacing: 3px;
}

p {
    font-size: 32px;
    opacity: 0;
    animation: fadeIn 2s ease forwards;
    animation-delay: 4s;
}

/* 动画 */
@keyframes draw {
    to { stroke-dashoffset: 0; }
}

@keyframes fadeIn {
    to { opacity: 1; }
}

/* 漂浮爱心（升级版） */
.heart {
    position: fixed;
    color: #ff4d6d;
    animation: floatUp linear infinite;
    opacity: 0.8;
    filter: blur(1px);
}

@keyframes floatUp {
    from {
        transform: translateY(100vh) scale(0.8);
        opacity: 0;
    }
    20% {
        opacity: 1;
    }
    to {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="bg-glow"></div>

<div class="center">

<svg viewBox="0 0 512 512">
<path id="heartPath"
d="M256 464s-183-101-183-232c0-66 54-120 120-120 41 0 76 21 99 54 23-33 58-54 99-54 66 0 120 54 120 120 0 131-183 232-183 232z"/>
</svg>

<h1>我喜欢你 ❤️</h1>
<p>不是一时冲动，是认真考虑过未来的那种喜欢</p>

</div>

<script>

/* ❤️ 大号漂浮爱心 */
setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤";

    let size = Math.random() * 40 + 20;  // 👉 更大
    heart.style.fontSize = size + "px";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 3 + 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 7000);
}, 200);


/* ❤️ 绘制路径时的粒子效果 */
let path = document.getElementById("heartPath");
let length = path.getTotalLength();

let i = 0;
let interval = setInterval(() => {
    let point = path.getPointAtLength(i);

    let spark = document.createElement("div");
    spark.className = "spark";
    spark.style.left = point.x + window.innerWidth/2 - 160 + "px";
    spark.style.top = point.y + window.innerHeight/2 - 160 + "px";

    document.body.appendChild(spark);

    setTimeout(() => spark.remove(), 1000);

    i += 20;
    if (i > length) clearInterval(interval);

}, 30);

</script>

</body>
</html>
