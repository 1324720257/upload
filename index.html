<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>520 ❤️</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: "Segoe UI", sans-serif;
}

/* 🌌 背景图片 */
.bg-img {
    position: fixed;
    width: 100%;
    height: 100%;
    background: url("bg.jpg") center/cover no-repeat;
    filter: brightness(45%);
}

/* 🌸 光效叠加（核心高级感） */
.bg-glow {
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, rgba(255,77,109,0.25), transparent 70%);
}

/* 居中内容 */
.center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: white;
}

/* ❤️ SVG爱心 */
svg {
    width: 320px;
    height: 320px;
}

/* 爱心路径（细 + 发光） */
path {
    fill: none;
    stroke: #ff4d6d;
    stroke-width: 2;
    stroke-dasharray: 1500;
    stroke-dashoffset: 1500;
    animation: draw 3s ease forwards;
    filter: drop-shadow(0 0 20px #ff4d6d);
}

/* ✨ 粒子 */
.spark {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #ff4d6d;
    border-radius: 50%;
    box-shadow: 0 0 10px #ff4d6d;
    animation: sparkle 1s linear infinite;
}

@keyframes sparkle {
    from { opacity: 1; }
    to { opacity: 0; transform: scale(2); }
}

/* 💬 大字体 */
h1 {
    font-size: 72px;
    margin: 20px 0 10px;
    opacity: 0;
    animation: fadeIn 2s ease forwards;
    animation-delay: 3s;
    letter-spacing: 4px;
}

p {
    font-size: 32px;
    opacity: 0;
    animation: fadeIn 2s ease forwards;
    animation-delay: 4s;
}

/* 动画 */
@keyframes draw {
    to { stroke-dashoffset: 0; }
}

@keyframes fadeIn {
    to { opacity: 1; }
}

/* ❤️ 漂浮爱心（大 + 分层 + 模糊） */
.heart {
    position: fixed;
    color: #ff4d6d;
    pointer-events: none;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    0% {
        transform: translateY(100vh) scale(0.8);
        opacity: 0;
    }
    20% {
        opacity: 1;
    }
    100% {
        transform: translateY(-10vh) scale(1.6);
        opacity: 0;
    }
}
</style>
</head>

<body>

<!-- 🌌 背景 -->
<div class="bg-img"></div>
<div class="bg-glow"></div>

<!-- ❤️ 主体 -->
<div class="center">

<svg viewBox="0 0 512 512">
<path id="heartPath"
d="M256 464s-183-101-183-232c0-66 54-120 120-120 41 0 76 21 99 54 23-33 58-54 99-54 66 0 120 54 120 120 0 131-183 232-183 232z"/>
</svg>

<h1>520快乐  徐颖  遇见你之后 ❤️</h1>
<p>风也温柔，夜也漫长，连时间都慢了下来</p>

</div>

<script>

/* ❤️ 漂浮大爱心（升级版） */
setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤";

    let size = Math.random() * 50 + 20;   // 👉 更大
    heart.style.fontSize = size + "px";
    heart.style.left = Math.random() * 100 + "vw";

    let duration = Math.random() * 3 + 4;
    heart.style.animationDuration = duration + "s";

    /* 模糊做景深 */
    heart.style.filter = `blur(${Math.random()*2}px)`;

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 7000);

}, 180);


/* ✨ 爱心绘制粒子效果 */
let path = document.getElementById("heartPath");
let length = path.getTotalLength();

let i = 0;
let interval = setInterval(() => {

    let point = path.getPointAtLength(i);

    let spark = document.createElement("div");
    spark.className = "spark";

    spark.style.left = (point.x + window.innerWidth/2 - 160) + "px";
    spark.style.top = (point.y + window.innerHeight/2 - 160) + "px";

    document.body.appendChild(spark);

    setTimeout(() => spark.remove(), 1000);

    i += 18;

    if (i > length) clearInterval(interval);

}, 25);

</script>

</body>
</html>
