<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>520 ❤️</title>

<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
    font-family: "Segoe UI", sans-serif;
}

/* 背景 */
.bg {
    position: fixed;
    width: 100%;
    height: 100%;
    background: url("/bg.jpg") center/cover no-repeat;
    filter: brightness(50%);
}

/* 居中 */
.center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: white;
}

/* ❤️ SVG心形 */
svg {
    width: 300px;
    height: 300px;
    margin-bottom: 20px;
}

/* 画线动画 */
path {
    fill: none;
    stroke: #ff4d6d;
    stroke-width: 4;
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: draw 3s ease forwards;
}

/* 发光 */
path {
    filter: drop-shadow(0 0 10px #ff4d6d);
}

/* 文字 */
h1 {
    font-size: 64px;
    margin: 10px 0;
    opacity: 0;
    animation: fadeIn 2s ease forwards;
    animation-delay: 3s;
}

p {
    font-size: 28px;
    opacity: 0;
    animation: fadeIn 2s ease forwards;
    animation-delay: 4s;
}

/* 动画定义 */
@keyframes draw {
    to {
        stroke-dashoffset: 0;
    }
}

@keyframes fadeIn {
    to {
        opacity: 1;
    }
}

/* 飘心 */
.heart {
    position: fixed;
    color: #ff4d6d;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
    from {
        transform: translateY(100vh);
        opacity: 1;
    }
    to {
        transform: translateY(-10vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="center">

    <!-- ❤️ 爱心路径 -->
    <svg viewBox="0 0 512 512">
        <path d="M256 464s-183-101-183-232c0-66 54-120 120-120 41 0 76 21 99 54 23-33 58-54 99-54 66 0 120 54 120 120 0 131-183 232-183 232z"/>
    </svg>

    <h1>我喜欢你 ❤️</h1>
    <p>不是一时兴起，是很久很久的决定</p>

</div>

<script>
/* 飘心效果 */
setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
}, 300);
</script>

</body>
</html>
